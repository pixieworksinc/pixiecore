name: Customer discount
version: 1.0.0
role: assistant
temperature: 0
input_placeholders:
  - name: customer_tier
    type: string
    required: true
  - name: purchase_amount
    type: number
    required: true
input_schema:
  type: object
  additionalProperties: false
  required: [customer_tier, purchase_amount]
  properties:
    customer_tier: { type: string }
    purchase_amount: { type: number }
prompt:
  agent_role: orchestrator
  Scenario:
    - Role: classifier
      Instruction:
        Given: The customer tier is {{ customer_tier }} and the purchase amount is {{ purchase_amount }}.
        When: Evaluate whether customer_tier exactly equals "Gold" and, separately, whether purchase_amount is strictly greater than 1000.
        Then: Set discount to 0.15 only if both Boolean comparisons are true; otherwise set discount to 0.
        And:
          - Do not trim, change case, infer, or substitute either input.
          - A purchase_amount of exactly 1000 does not qualify.
    - Role: converter
      Instruction:
        Given: The classifier has selected a discount expressed as a decimal fraction, either 0.15 or 0.
        When: Calculate the final purchase price using the original purchase_amount.
        Then: Calculate final_price as purchase_amount multiplied by (1 - discount).
        And:
          - When discount is 0, final_price equals purchase_amount exactly.
          - Do not round, convert currency, or add fees.
    - Role: verifier
      Instruction:
        Given: The original customer tier is {{ customer_tier }} and the original purchase amount is {{ purchase_amount }}.
        When: Independently recheck both comparisons, the discount fraction, and the final-price arithmetic against the original inputs.
        Then: Correct any discrepancy before producing the final result.
        And: Keep the comparisons independent; neither condition alone earns a discount.
    - Role: orchestrator
      Instruction:
        Given: The classifier, converter, and verifier instructions are defined in this Scenario array.
        When: Process the request by following those Roles in their declared order.
        Then: Return only discount and final_price as JSON matching output_schema.
        And:
          - Execute the comparisons, policy, arithmetic, and verification yourself as the LLM runtime.
          - Do not generate executable code or delegate this business logic to a tool.
output_schema:
  type: object
  additionalProperties: false
  required: [discount, final_price]
  properties:
    discount: { type: number, enum: [0, 0.15] }
    final_price: { type: number }
examples:
  - input: { customer_tier: Gold, purchase_amount: 1500 }
    output: { discount: 0.15, final_price: 1275 }
  - input: { customer_tier: Gold, purchase_amount: 1000 }
    output: { discount: 0, final_price: 1000 }
  - input: { customer_tier: Silver, purchase_amount: 1500 }
    output: { discount: 0, final_price: 1500 }
