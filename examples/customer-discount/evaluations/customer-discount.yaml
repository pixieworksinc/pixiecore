schema: pixiecore.blueprint-eval-dataset/v1
name: LLM customer discount policy
version: 1.0.0
description: Exact-match boundaries and arithmetic for prompt-first discount execution.
blueprint:
  path: ../customer-discount.yaml
  version: 1.0.0
tags: [prompt-first, deterministic-specification, multi-role]
cases:
  - id: gold-over-threshold
    tags: [boundary]
    inputs: { customer_tier: Gold, purchase_amount: 1500 }
    expected_output: { discount: 0.15, final_price: 1275 }
    comparison: { mode: exact }
  - id: gold-at-threshold
    tags: [boundary]
    inputs: { customer_tier: Gold, purchase_amount: 1000 }
    expected_output: { discount: 0, final_price: 1000 }
    comparison: { mode: exact }
  - id: gold-below-threshold
    tags: [boundary]
    inputs: { customer_tier: Gold, purchase_amount: 999.99 }
    expected_output: { discount: 0, final_price: 999.99 }
    comparison: { mode: exact }
  - id: gold-just-over-threshold
    tags: [boundary]
    inputs: { customer_tier: Gold, purchase_amount: 1000.01 }
    expected_output: { discount: 0.15, final_price: 850.0085 }
    comparison: { mode: exact }
  - id: silver-over-threshold
    tags: [boundary]
    inputs: { customer_tier: Silver, purchase_amount: 1500 }
    expected_output: { discount: 0, final_price: 1500 }
    comparison: { mode: exact }
  - id: silver-at-threshold
    tags: [boundary]
    inputs: { customer_tier: Silver, purchase_amount: 1000 }
    expected_output: { discount: 0, final_price: 1000 }
    comparison: { mode: exact }
  - id: silver-below-threshold
    tags: [boundary]
    inputs: { customer_tier: Silver, purchase_amount: 500 }
    expected_output: { discount: 0, final_price: 500 }
    comparison: { mode: exact }
  - id: lowercase-is-not-gold
    tags: [exact-tier-match]
    inputs: { customer_tier: gold, purchase_amount: 1500 }
    expected_output: { discount: 0, final_price: 1500 }
    comparison: { mode: exact }
  - id: uppercase-is-not-gold
    tags: [exact-tier-match]
    inputs: { customer_tier: GOLD, purchase_amount: 1500 }
    expected_output: { discount: 0, final_price: 1500 }
    comparison: { mode: exact }
  - id: trailing-space-is-not-gold
    tags: [exact-tier-match]
    inputs: { customer_tier: 'Gold ', purchase_amount: 1500 }
    expected_output: { discount: 0, final_price: 1500 }
    comparison: { mode: exact }
  - id: leading-space-is-not-gold
    tags: [exact-tier-match]
    inputs: { customer_tier: ' Gold', purchase_amount: 1500 }
    expected_output: { discount: 0, final_price: 1500 }
    comparison: { mode: exact }
  - id: empty-tier-is-not-gold
    tags: [exact-tier-match]
    inputs: { customer_tier: '', purchase_amount: 1500 }
    expected_output: { discount: 0, final_price: 1500 }
    comparison: { mode: exact }
  - id: zero-purchase
    tags: [boundary]
    inputs: { customer_tier: Gold, purchase_amount: 0 }
    expected_output: { discount: 0, final_price: 0 }
    comparison: { mode: exact }
  - id: negative-purchase
    tags: [boundary]
    inputs: { customer_tier: Gold, purchase_amount: -100 }
    expected_output: { discount: 0, final_price: -100 }
    comparison: { mode: exact }
  - id: non-gold-decimal-unchanged
    tags: [arithmetic]
    inputs: { customer_tier: Bronze, purchase_amount: 1234.56 }
    expected_output: { discount: 0, final_price: 1234.56 }
    comparison: { mode: exact }
  - id: gold-decimal-no-rounding
    tags: [arithmetic]
    inputs: { customer_tier: Gold, purchase_amount: 1234.56 }
    expected_output: { discount: 0.15, final_price: 1049.376 }
    comparison: { mode: exact }
  - id: gold-integer-with-fractional-result
    tags: [arithmetic]
    inputs: { customer_tier: Gold, purchase_amount: 1001 }
    expected_output: { discount: 0.15, final_price: 850.85 }
    comparison: { mode: exact }
  - id: gold-large-purchase
    tags: [arithmetic]
    inputs: { customer_tier: Gold, purchase_amount: 100000 }
    expected_output: { discount: 0.15, final_price: 85000 }
    comparison: { mode: exact }
