name: Translate and localize travel purpose text
version: 1.0.1
role: assistant
temperature: 0
input_placeholders:
  - name: source_text
    type: string
    required: true
    description: One travel-purpose or approval-comment text.
  - name: source_language
    type: string
    required: true
    description: Explicit language code for the source text.
  - name: target
    type: object
    required: true
    description: Supported target language and locale pair.
  - name: protected_terms
    type: array
    required: true
    description: Exact terms that must not be translated or reformatted.
  - name: policy
    type: object
    required: true
    description: Versioned localization policy supplied by the application.
input_schema:
  type: object
  additionalProperties: false
  required: [source_text, source_language, target, protected_terms, policy]
  properties:
    source_text:
      type: string
      minLength: 1
      pattern: '\S'
    source_language: { type: string, enum: [en, ja] }
    target:
      oneOf:
        - type: object
          additionalProperties: false
          required: [language, locale]
          properties:
            language: { const: en }
            locale: { const: en-US }
        - type: object
          additionalProperties: false
          required: [language, locale]
          properties:
            language: { const: ja }
            locale: { const: ja-JP }
    protected_terms:
      type: array
      uniqueItems: true
      items:
        type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind:
            type: string
            enum: [person, organization, place, identifier, amount]
          value:
            type: string
            minLength: 1
            pattern: '\S'
    policy:
      type: object
      additionalProperties: false
      required:
        - version
        - protected_term_matching
        - preserve_line_breaks
        - style
        - max_output_characters
      properties:
        version:
          type: string
          pattern: '^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$'
        protected_term_matching: { const: exact_case_sensitive }
        preserve_line_breaks: { const: true }
        style: { const: business_formal }
        max_output_characters:
          type: integer
          minimum: 1
          maximum: 5000
prompt: |
  Translate and localize exactly one travel-purpose or approval-comment text.

  Source text: {{ source_text }}
  Source language: {{ source_language }}
  Target: {{ target }}
  Protected terms: {{ protected_terms }}
  Policy: {{ policy }}

  Apply these rules exactly:
  1. Use only the explicit source and target languages. Never detect or infer a
     different language or locale.
  2. Copy every exact, case-sensitive occurrence of each protected term without
     changing spelling, case, whitespace, punctuation inside the value, number
     formatting, or currency notation. This applies to people, organizations,
     places, identifiers, and amounts.
  3. Count each protected term's non-overlapping exact occurrences in the
     source and localized output. Both counts must be equal and preserved=true.
  4. Preserve the number and ordering of line breaks.
  5. Translate unprotected prose in a business-formal style. Locale-dependent
     punctuation or date/number formatting may change only when the fragment
     is not protected. Record each material transformation in changes.
  6. If source_language equals target.language and no locale-dependent change
     is necessary, copy source_text exactly, return status=unchanged, and
     return no changes. Otherwise return status=localized with at least one
     change.
  7. The localized text must not exceed policy.max_output_characters.

  Return the exact policy version. Do not summarize, add facts, validate the
  request, translate protected values, route approval, or call external tools.
  Return only JSON matching the output schema.
output_schema:
  oneOf:
    - $ref: '#/$defs/localizedResult'
    - $ref: '#/$defs/unchangedResult'
  $defs:
    protectedTermResult:
      type: object
      additionalProperties: false
      required: [kind, value, preserved, source_occurrences, output_occurrences]
      properties:
        kind:
          type: string
          enum: [person, organization, place, identifier, amount]
        value:
          type: string
          minLength: 1
          pattern: '\S'
        preserved: { const: true }
        source_occurrences: { type: integer, minimum: 0 }
        output_occurrences: { type: integer, minimum: 0 }
    change:
      type: object
      additionalProperties: false
      required: [kind, source_fragment, localized_fragment]
      properties:
        kind:
          type: string
          enum: [translation, punctuation, date_format, number_format]
        source_fragment:
          type: string
          minLength: 1
          pattern: '\S'
        localized_fragment:
          type: string
          minLength: 1
          pattern: '\S'
    localizedResult:
      type: object
      additionalProperties: false
      required:
        - status
        - localized_text
        - source_language
        - target_language
        - target_locale
        - policy_version
        - protected_term_results
        - changes
      properties:
        status: { const: localized }
        localized_text:
          type: string
          minLength: 1
          pattern: '\S'
        source_language: { type: string, enum: [en, ja] }
        target_language: { type: string, enum: [en, ja] }
        target_locale: { type: string, enum: [en-US, ja-JP] }
        policy_version:
          type: string
          minLength: 1
        protected_term_results:
          type: array
          items: { $ref: '#/$defs/protectedTermResult' }
        changes:
          type: array
          minItems: 1
          items: { $ref: '#/$defs/change' }
    unchangedResult:
      type: object
      additionalProperties: false
      required:
        - status
        - localized_text
        - source_language
        - target_language
        - target_locale
        - policy_version
        - protected_term_results
        - changes
      properties:
        status: { const: unchanged }
        localized_text:
          type: string
          minLength: 1
          pattern: '\S'
        source_language: { type: string, enum: [en, ja] }
        target_language: { type: string, enum: [en, ja] }
        target_locale: { type: string, enum: [en-US, ja-JP] }
        policy_version:
          type: string
          minLength: 1
        protected_term_results:
          type: array
          items: { $ref: '#/$defs/protectedTermResult' }
        changes: { type: array, maxItems: 0 }
examples:
  - input:
      source_text: 'Alex Morgan from Northstar Labs will meet in New York for request TR-204.'
      source_language: en
      target: { language: ja, locale: ja-JP }
      protected_terms:
        - { kind: person, value: Alex Morgan }
        - { kind: organization, value: Northstar Labs }
        - { kind: place, value: New York }
        - { kind: identifier, value: TR-204 }
      policy:
        version: 2026.1.0
        protected_term_matching: exact_case_sensitive
        preserve_line_breaks: true
        style: business_formal
        max_output_characters: 1000
    output:
      status: localized
      localized_text: 'Northstar LabsのAlex Morganが、申請TR-204のためNew Yorkで面談します。'
      source_language: en
      target_language: ja
      target_locale: ja-JP
      policy_version: 2026.1.0
      protected_term_results:
        - { kind: person, value: Alex Morgan, preserved: true, source_occurrences: 1, output_occurrences: 1 }
        - { kind: organization, value: Northstar Labs, preserved: true, source_occurrences: 1, output_occurrences: 1 }
        - { kind: place, value: New York, preserved: true, source_occurrences: 1, output_occurrences: 1 }
        - { kind: identifier, value: TR-204, preserved: true, source_occurrences: 1, output_occurrences: 1 }
      changes:
        - kind: translation
          source_fragment: will meet in
          localized_fragment: で面談します
