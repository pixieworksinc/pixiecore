name: Validate publication brief summary
version: '1.0.1'
role: assistant
input_placeholders:
  - name: facts
    type: array
    required: true
  - name: summary
    type: string
    required: true
input_schema:
  type: object
  additionalProperties: false
  required: [facts, summary]
  properties:
    facts:
      type: array
      minItems: 1
      items: { type: string, minLength: 1 }
    summary: { type: string, minLength: 1 }
prompt: |
  Check whether the summary is supported by the supplied facts and contains no
  unsupported claims.

  Facts: {{ facts }}
  Summary: {{ summary }}

  Return valid=true with an empty issues array when supported. Otherwise return
  valid=false and list each issue. Return only JSON matching the output schema.
output_schema:
  type: object
  additionalProperties: false
  required: [valid, issues]
  properties:
    valid: { type: boolean }
    issues:
      type: array
      items: { type: string, minLength: 1 }
