worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
  include /etc/nginx/mime.types;
  access_log off;
  client_body_temp_path /tmp/client_body;
  fastcgi_temp_path /tmp/fastcgi;
  proxy_temp_path /tmp/proxy;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 128k;
  server_tokens off;
  map $http_x_forwarded_proto $demo_https { default off; https on; }
  server {
    listen 8080;
    root /opt/drupal/web;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    location = / { root /demo/public; try_files /index.html =404; }
    location = /healthz { default_type text/plain; return 200 'offline-demo\n'; }
    location = /pixieagent { return 301 /pixieagent/; }
    location ^~ /pixieagent/live { return 404; }
    location ^~ /pixieagent/ {
      root /demo/public;
      try_files $uri $uri/ =404;
      add_header X-Robots-Tag "noindex, nofollow" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }
    location = /user/register { return 403; }
    location = /user/password { return 403; }
    location ~ /\. { return 404; }
    location ~* \.(?:yml|yaml|json|lock|sql|sqlite|sh|inc|module|install|theme|txt)$ { return 404; }
    location / { try_files $uri /index.php?$query_string; }
    location = /index.php {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /opt/drupal/web/index.php;
      fastcgi_param HTTPS $demo_https;
      fastcgi_param HTTP_PROXY '';
      fastcgi_pass 127.0.0.1:9000;
      fastcgi_read_timeout 30s;
    }
    location ~ \.php(?:/|$) { return 404; }
    location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ { try_files $uri =404; }
  }
}
