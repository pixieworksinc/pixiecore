name: Monolithic publication brief
version: '1.0.1'
role: assistant
input_placeholders:
  - name: source_text
    type: string
    required: true
  - name: locale
    type: string
    required: true
input_schema:
  type: object
  additionalProperties: false
  required: [source_text, locale]
  properties:
    source_text:
      type: string
      minLength: 1
    locale:
      type: string
      minLength: 1
prompt: |
  Complete this entire publication-brief workflow in one response:

  1. Extract a short title, intended audience, and only facts present in the
     source.
  2. Classify the brief as operations, policy, product, or other.
  3. Write a factual summary without adding claims.
  4. Validate that the summary is supported by the extracted facts.
  5. Localize the summary for the requested locale.

  Source text:
  {{ source_text }}

  Locale:
  {{ locale }}

  Return only JSON matching the output schema. This file is an intentional
  monolithic comparison example, not a recommended Blueprint boundary.
output_schema:
  type: object
  additionalProperties: false
  required: [extraction, classification, summary, validation, localization]
  properties:
    extraction:
      type: object
      additionalProperties: false
      required: [title, audience, facts]
      properties:
        title: { type: string, minLength: 1 }
        audience: { type: string, minLength: 1 }
        facts:
          type: array
          minItems: 1
          items: { type: string, minLength: 1 }
    classification:
      type: object
      additionalProperties: false
      required: [category, rationale]
      properties:
        category:
          enum: [operations, policy, product, other]
        rationale: { type: string, minLength: 1 }
    summary:
      type: object
      additionalProperties: false
      required: [summary]
      properties:
        summary: { type: string, minLength: 1 }
    validation:
      type: object
      additionalProperties: false
      required: [valid, issues]
      properties:
        valid: { type: boolean }
        issues:
          type: array
          items: { type: string }
    localization:
      type: object
      additionalProperties: false
      required: [locale, localized_summary]
      properties:
        locale: { type: string, minLength: 1 }
        localized_summary: { type: string, minLength: 1 }
