name: Reproducible demos
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build from locked public source
        run: |
          docker build -f examples/demo/Dockerfile --target demo -t pixiecore-demos:local .
          docker build -f examples/demo/Dockerfile --target web -t pixiecore-demos-web:local .
      - name: Measure built image
        run: docker image inspect pixiecore-demos:local pixiecore-demos-web:local --format '{{.Id}} {{.Size}}'
      - name: Test live host with injected responses and no external network
        run: docker run --rm --network none --read-only --tmpfs /tmp:size=32m,mode=1777 --entrypoint node pixiecore-demos:local --test /runtime/examples/integrations/drupal/executable-specification/runtime/live-server.test.js
      - name: Install Japanese fonts for browser verification
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Test isolated bootstrap and recreation
        run: |
          export DEMO_PASSWORD_FILE="$RUNNER_TEMP/demo-password"
          umask 077
          openssl rand -hex 24 > "$DEMO_PASSWORD_FILE"
          chmod 644 "$DEMO_PASSWORD_FILE"
          export DEMO_SCREENSHOTS_DIRECTORY="$RUNNER_TEMP/demo-screenshots"
          sh examples/demo/test-container.sh
          sh examples/demo/test-live-container.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-screenshots
          path: ${{ runner.temp }}/demo-screenshots/
          retention-days: 3
      - name: Record tested image size and export
        if: github.event_name == 'push'
        run: |
          docker image inspect pixiecore-demos:local pixiecore-demos-web:local --format '{{.Id}} {{.Size}}' > image-metadata.txt
          docker save pixiecore-demos:local pixiecore-demos-web:local | gzip -1 > pixiecore-demos.tar.gz
          sha256sum pixiecore-demos.tar.gz > pixiecore-demos.tar.gz.sha256
          # Allow an app-only replacement while retaining an unchanged gateway.
          docker save pixiecore-demos:local | gzip -1 > pixiecore-demo-app.tar.gz
          sha256sum pixiecore-demo-app.tar.gz > pixiecore-demo-app.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: pixiecore-demos-image
          path: |
            pixiecore-demos.tar.gz
            pixiecore-demos.tar.gz.sha256
            image-metadata.txt
          retention-days: 3
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push'
        with:
          name: pixiecore-demo-app-image
          path: |
            pixiecore-demo-app.tar.gz
            pixiecore-demo-app.tar.gz.sha256
          retention-days: 3
